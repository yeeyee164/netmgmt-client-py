global:
  debug: false
  insecure: true

outputs:
  log_file:
    output-type: file
    path: "./tests/gnmi_multi_sub_test.json"
    format: json

# For gNMI Subscribe RPC
subscriptions:
  interfaces_B:
    mode: "stream"
    encoding: "json_ietf"
    update_only:
    subscription:
      path:
      - 'ipi:/interfaces/interface[name="TenGi0/10"]/state/counters'
      - 'ipi:/interfaces/interface[name="TenGi0/2"]/state/counters'
      mode: "sample"
      sample_interval: 90 # seconds

  interfaces:
    mode: "stream"
    encoding: "json_ietf"
    subscription:
      path:
      - 'ipi:/interfaces/interface[name="TenGi0/13"]/state'
      - 'ipi:/interfaces/interface[name="TenGi0/14"]/state'
      mode: "on_change"

targets:
  10.1.11.101:9339: # only one RPC per target
    protocol: "gnmi"
    subscriptions:
      - interfaces
      - interfaces_B
    username: "admin"
    password: "Frontier12#"
  
